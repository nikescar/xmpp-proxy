user nobody;
worker_processes auto;
pid /run/nginx.pid;
error_log /logs/nginx-error.log warn;

events {
    worker_connections 768;
}

http {
    ##
    # Basic Settings
    ##
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # Logging
    ##
    access_log /logs/nginx-access.log;

    ##
    # Gzip
    ##
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    ##
    # Default Server
    ##
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Health check endpoint
        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ACME HTTP-01 challenge
        location /.well-known/acme-challenge/ {
            root /var/run/acme/;
        }

        # Redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }

        ##
        # Include dynamic proxy configurations - must be inside this server
        # block since each file is a bare `location {}` block, which nginx
        # only allows nested in a server (or another location) context
        ##
        include /etc/nginx/conf.d/*.conf;
    }

    ##
    # HTTPS Server
    ##
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        ssl_certificate /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;

        # Connection success message
        location = / {
            return 200 'Connection succeed\n';
            add_header Content-Type text/plain;
        }

        # Include dynamic proxy configurations
        include /etc/nginx/conf.d/*.conf;
    }
}
